<!doctype html><meta charset="utf-8">
<!-- Concept F «Глубина»: E2 layout (benchmark system) on a two-zone scene: light sunlit wall under the text | deep wall
     with art, plant and a prop behind the expert. The headline crosses the wall edge; glyphs flip ink -> white exactly
     where the background is dark (benchmark: «плаНЫ» split mid-letter at the wall edge, white #fff over rgb(41,48,51)).
     ?e=<expert>[&h=line1|line2][&sd=scenes-f2]  (F2: deeper back wall, see mk-bg-f2.py) -->
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="../instagram/site.js"></script><script src="heads-f.js"></script><script>document.write(`<script src="${new URLSearchParams(location.search).get('sd')||'scenes-f'}/geo.js"><\/script>`)</script>
<script>
const P=new URLSearchParams(location.search),E=P.get('e')||'mira',W=1440,H=1080,S=SITE[E],GE=GEO[E];
const HD=P.get('h')?P.get('h').split('|'):HEADS_F[E];
const cv=document.getElementById('c');cv.width=W;cv.height=H;const g=cv.getContext('2d');
const INK='#17191d';
function rgb(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function hsl(r,g_,b){r/=255;g_/=255;b/=255;const M=Math.max(r,g_,b),m=Math.min(r,g_,b),l=(M+m)/2;let h=0,s=0;if(M!==m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M===r?(g_-b)/d+(g_<b?6:0):M===g_?(b-r)/d+2:(r-g_)/d+4;h*=60}return[h,s,l]}
const [ah,as]=hsl(...rgb(S.accent));const PILLTXT=`hsl(${ah} ${Math.min(100,(as*1.9+.25)*100)}% 88%)`;
const fonts=[['PL','fonts/Pretendard-Light.otf'],['PR','fonts/Pretendard-Regular.otf'],['PM','fonts/Pretendard-Medium.otf'],['MR','../instagram/manrope.woff']];
function setf(c,font,fs,ls){c.font=`${fs}px ${font}`;c.letterSpacing=(ls||0)*fs+'px';c.textBaseline='alphabetic'}
function width(t,font,fs,ls){setf(g,font,fs,ls);return g.measureText(t).width}
const OPS=[];  // every text op is drawn twice: ink everywhere, white clipped to the dark-background mask
function text(t,x,y,font,fs,col,ls,light){OPS.push([t,x,y,font,fs,col,ls,light])}
Promise.all(fonts.map(([n,u])=>new FontFace(n,`url(${u})`,n==='MR'?{weight:'200 800'}:{}).load().then(f=>document.fonts.add(f)))).then(()=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.src=`${P.get('sd')||'scenes-f'}/${E}-16x9.jpg?t=${Date.now()}`})).then(im=>{
  const L=80;
  // headline size: benchmark 135.7px; shrink only if a line is wider than 700 (benchmark line 2 ends at x≈690)
  let fs=135.7;const wmax=Math.max(...HD.map(l=>width(l,'PL',fs,-.03)));if(wmax>700)fs*=700/wmax;const k=fs/135.7;
  const end=L-10+wmax*Math.min(1,700/wmax);
  // crop: put the wall edge so the headline's tail crosses into the dark zone (benchmark: ~40px, here up to 110px),
  // but the tail stays ≥50px clear of the hair/face
  const cross=Math.max(30,Math.min(110,GE.hx-GE.bx-50));
  let off=Math.round(GE.bx-(end-cross));off=Math.max(0,Math.min(480,GE.bx-560,off));  // light zone ≥ 560px (benchmark: 652)
  g.drawImage(im,off,0,W,H,0,0,W,H);
  // dark mask from the actual pixels (box-blurred luma < 92): exact wall edge, also catches dark hair/clothes
  const id=g.getImageData(0,0,W,H).data, Y=new Float32Array(W*H);
  for(let i=0;i<W*H;i++)Y[i]=.2126*id[4*i]+.7152*id[4*i+1]+.0722*id[4*i+2];
  const R=3,T=new Float32Array(W*H),B=new Float32Array(W*H);
  for(let y=0;y<H;y++){let s=0;for(let x=-R;x<=R;x++)s+=Y[y*W+Math.min(W-1,Math.max(0,x))];for(let x=0;x<W;x++){T[y*W+x]=s/(2*R+1);s+=Y[y*W+Math.min(W-1,x+R+1)]-Y[y*W+Math.max(0,x-R)]}}
  for(let x=0;x<W;x++){let s=0;for(let y=-R;y<=R;y++)s+=T[Math.min(H-1,Math.max(0,y))*W+x];for(let y=0;y<H;y++){B[y*W+x]=s/(2*R+1);s+=T[Math.min(H-1,y+R+1)*W+x]-T[Math.max(0,y-R)*W+x]}}
  const mk=document.createElement('canvas');mk.width=W;mk.height=H;const mg=mk.getContext('2d'),md=mg.createImageData(W,H);
  for(let i=0;i<W*H;i++){md.data[4*i+3]=B[i]<92?255:0}mg.putImageData(md,0,0);
  // ---- E2 layout (measured on the benchmark) ----
  text(S.name+'.',L-7,202,'PR',80.2,INK,.01);
  HD.forEach((l,i)=>text(l,L-10,395+i*116.5*k,'PL',fs,INK,-.03));
  const rs=56.3;let r1=S.role,r2='в Telegram';if(width(r1,'PR',rs,.035)>560){const j=r1.lastIndexOf(' ');r2=r1.slice(j+1)+' в Telegram';r1=r1.slice(0,j)}
  text(r1,L-5,643,'PR',rs,INK,.035);text(r2,L-5,710,'PR',rs,INK,.035);
  g.beginPath();g.roundRect(63,773,499,99,49.5);g.fillStyle='rgb(19,25,26)';g.fill();
  const pf=61.9*408/width(OFFER.free,'PM',61.9,-.005);
  OPS.forEach(o=>{setf(g,o[3],o[4],o[6]);g.fillStyle=o[5];g.fillText(o[0],o[1],o[2])});
  setf(g,'PM',pf,-.005);g.fillStyle=PILLTXT;g.fillText(OFFER.free,116,842);
  g.font='300 32px MR';g.letterSpacing='10px';g.fillStyle='rgba(23,25,29,.78)';g.fillText('EYRA',L,86);
  setf(g,'PR',40,-.005);g.fillStyle='rgba(23,25,29,.80)';g.fillText(OFFER.nocard,L,937);
  // split-tone: same glyphs in white, kept only where the background is dark
  const wt=document.createElement('canvas');wt.width=W;wt.height=H;const wg=wt.getContext('2d');
  OPS.forEach(o=>{setf(wg,o[3],o[4],o[6]);wg.fillStyle='#fff';wg.fillText(o[0],o[1],o[2])});
  wg.globalCompositeOperation='destination-in';wg.drawImage(mk,0,0);g.drawImage(wt,0,0);
  window.INFO={off,end,cross,fs};document.title='ready';
});
</script>
