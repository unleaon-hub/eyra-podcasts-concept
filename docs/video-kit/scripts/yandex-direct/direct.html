<!doctype html><html lang="ru"><head><meta charset="utf-8">
<!-- EYRA · Yandex Direct concept template. ?c=A|B|C|D&e=asya&w=1920&h=1080&t=headline -->
<style>
@font-face{font-family:M;src:url(../instagram/manrope.woff)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:M,sans-serif;overflow:hidden;position:relative;color:#1d1f1a;-webkit-font-smoothing:antialiased}
.a{position:absolute}.t{position:absolute;line-height:1.05;letter-spacing:-.035em;font-weight:600;text-wrap:balance}
img.bg{position:absolute;object-fit:cover}
canvas{position:absolute}
.chip{position:absolute;border-radius:999px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:.5em;letter-spacing:-.01em}
</style>
<script src="../instagram/site.js"></script><script src="../instagram/lock.js"></script><script src="../instagram/cut.js"></script>
<script src="heads.js"></script><script src="mask.js"></script>
</head><body>
<script>
const P=new URLSearchParams(location.search),C=P.get('c')||'A',K=P.get('e')||'asya',W=+(P.get('w')||1920),H=+(P.get('h')||1080);
const ty=t=>t.replace(/(^|\s)(в|с|на|и|о|а|к|у|по|не|за|из|от|до)\s/gi,'$1$2\u00a0');
const S=SITE[K],O=OFFER,HD=(window.HEADS||{})[K]||{},T=ty(P.get('t')||HD.t||S.tagline),u=H/1080,B=document.body;
B.style.width=W+'px';B.style.height=H+'px';
// colours: site accent made brighter (HSL) for ads
function hsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!=mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx==r?(g-b)/d+(g<b?6:0):mx==g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s*100,l*100]}
const [AH,AS]=hsl(S.accent),col=(s,l,a=1)=>`hsla(${AH},${s}%,${l}%,${a})`;
const VIV=col(Math.min(72,AS+38),62),VIV2=col(Math.min(80,AS+42),74),DEEP=col(Math.min(55,AS+18),26),PALE=col(Math.min(60,AS+20),95),INK='#1d1f1a';
const el=(cls,html,css)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,css);B.append(d);return d};
const imgs=[];const img=(src,css,cls='a')=>{const i=new Image();i.src=src;i.className=cls;Object.assign(i.style,css);B.append(i);imgs.push(i);return i};
const px=v=>Math.round(v*u)+'px';
// fit: shrink font until text fits the box (width w, max lines n)
function fit(d,max,min,w,n){d.style.width=w+'px';for(let f=max;f>=min;f-=2){d.style.fontSize=f+'px';const lh=parseFloat(getComputedStyle(d).lineHeight)||f*1.05;if(d.scrollWidth<=w+1&&d.offsetHeight<=lh*n+2)return f}return min}
const lock=(cap,x,y,ink)=>{const cv=document.createElement('canvas');B.append(cv);const L=lockup(cv,cap,ink?{ink,muted:ink}:{});cv.style.left=(x-L.pad)+'px';cv.style.top=(y-L.pad)+'px';return y+cap*1.17+L.tcap};
const ARW=`<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const TG=`<svg viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="currentColor"><path d="M21.5 4.3 2.9 11.5c-1 .4-1 1.6.1 1.9l4.7 1.5 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.8 3.5c.7.5 1.7.1 1.9-.8L23 5.6c.2-1-.7-1.7-1.5-1.3zM9.6 14.4l8.5-6.9-6.9 8.1-.3 3.1-1.3-4.3z"/></svg>`;
const offer=(x,y,fs,bg,fg)=>(fs=Math.round(fs*1.3),el('chip',`${O.free} · ${O.nocard}`,{left:x+'px',top:y+'px',fontSize:fs+'px',padding:`${fs*.55}px ${fs*.9}px`,background:bg,color:fg}));
const cta=(x,y,fs,bg,fg,label)=>(fs=Math.round(fs*1.25),el('chip',`${TG}${label||'Начать в Telegram'}${ARW}`,{left:x+'px',top:y+'px',fontSize:fs+'px',padding:`${fs*.6}px ${fs*1}px`,background:bg,color:fg}));
// scene background positioned so the expert stays visible on the right
const WORK='../template/work/';const M=(window.MASK||{})[K]||{c16:.7,c11:.68,f16:[.55,.85],f11:[.5,.86]};let FL=W;
function scene(filter,lift){
  const wide=W/H>1.2;let src,iw,ih;
  if(wide){src=WORK+K+'-16x9-up.jpg';ih=H;iw=H*16/9}else{src=WORK+K+'-1x1-up.jpg';ih=H;iw=H}
  const cx=(wide?M.c16:M.c11)*iw,want=W*(wide?.73:.70);let off=Math.min(Math.max(cx-want,0),iw-W);
  FL=Math.round((wide?M.f16[0]:M.f11[0])*iw-off);
  return img(src,{left:-off+'px',top:(lift&&!wide?-Math.max(0,((M.t11||.1)-.05))*H:0)+'px',width:iw+'px',height:ih+'px',filter:filter||'brightness(1.06) saturate(1.14) contrast(1.05)'},'bg');
}
const leak=(op)=>el('a','',{inset:0,background:`radial-gradient(ellipse at 8% 0%, rgba(255,236,200,${op}) 0, rgba(255,236,200,0) 55%)`,mixBlendMode:'screen'});
const QA={};
function measure(){let a=0;document.querySelectorAll('.t,.chip,canvas,.bub').forEach(n=>{const r=n.getBoundingClientRect();a+=r.width*r.height});QA.text=Math.round(a/(W*H)*100);
  let over=0;document.querySelectorAll('.t,.chip,.bub').forEach(n=>{const r=n.getBoundingClientRect();if(r.right>W-4||r.bottom>H-4||r.left<0)over++});QA.over=over}
const name=`${S.name} · ${S.role} в Telegram`;
// ---------- concepts ----------
const sq=W/H<1.2, pad=Math.round(72*u);
if(C==='A'){ // «Солнечная сцена»: IG v5 look pushed brighter — sunlit scene + frosted card
  scene();leak(.55);
  const cw=sq?W-2*pad:Math.min(Math.round(W*(W/H>1.5?.46:.52)),FL-pad-Math.round(10*u)), cx=pad, ch=sq?Math.round(H*.46):H-2*pad, cy=sq?H-pad-ch:pad;
  el('a','',{left:cx+'px',top:cy+'px',width:cw+'px',height:ch+'px',borderRadius:px(44),background:'rgba(255,255,255,.62)',backdropFilter:'blur(22px) saturate(1.3)',boxShadow:'0 30px 80px -30px rgba(80,60,30,.35), inset 0 0 0 1.5px rgba(255,255,255,.8)'});
  const ix=cx+Math.round(56*u),iw=cw-Math.round(112*u);
  if(!sq){lock(Math.round(34*u),ix,cy+Math.round(60*u))}else{lock(30,pad+10,pad)}
  const nm=el('t',name,{left:ix+'px',fontSize:px(36),fontWeight:600,letterSpacing:'-.01em',color:DEEP});
  const h=el('t',T,{left:ix+'px'});QA.fs=fit(h,sq?84:Math.round(108*u),48,iw,sq?2:3);
  const y0=sq?cy+Math.round(40*u):cy+Math.round(180*u);nm.style.top=y0+'px';h.style.top=(y0+Math.round(58*u))+'px';
  const yb=sq?cy+ch-Math.round(40*u)-Math.round(84*u):cy+ch-Math.round(56*u)-Math.round(84*u);
  if(sq){offer(ix,yb-92,28,VIV,INK);cta(ix,yb,28,INK,'#fff')}else{offer(ix,yb-Math.round(110*u),30,VIV,INK);cta(ix,yb,30,INK,'#fff')}
}
if(C==='B'){ // «Цветной акцент»: scene + bold panel in the expert's bright colour
  scene(null,true);
  if(sq){const ph=Math.round(H*.49);el('a','',{left:0,top:(H-ph)+'px',width:W+'px',height:ph+'px',background:`linear-gradient(135deg, ${VIV2}, ${VIV})`});
    lock(30,pad,pad);let y=H-ph+40;const h=el('t',T,{left:pad+'px',top:y+'px',color:INK});QA.fs=fit(h,84,48,W-2*pad,2);y+=h.offsetHeight+12;
    el('t',name,{left:pad+'px',top:y+'px',fontSize:'34px',fontWeight:600,letterSpacing:'-.01em',color:DEEP});
    offer(pad,H-pad-176,28,'#fff',INK);cta(pad,H-pad-84,28,INK,'#fff');
  } else {const pw=Math.min(Math.round(W*(W/H>1.5?.46:.52)),FL-Math.round(20*u));
    el('a','',{left:0,top:0,width:pw+'px',height:H+'px',background:`linear-gradient(160deg, ${VIV2} 0%, ${VIV} 100%)`,borderRadius:`0 ${px(60)} ${px(60)} 0`,boxShadow:'20px 0 60px -20px rgba(0,0,0,.18)'});
    lock(Math.round(34*u),pad,pad);const iw=pw-2*pad;
    const nm=el('t',name,{left:pad+'px',top:px(250),fontSize:px(36),fontWeight:600,letterSpacing:'-.01em',color:DEEP});
    const h=el('t',T,{left:pad+'px',top:px(304),color:INK});QA.fs=fit(h,Math.round(112*u),48,iw,3);
    offer(pad,H-pad-Math.round(196*u),30,'#fff',INK);cta(pad,H-pad-Math.round(84*u),30,INK,'#fff');}
}
if(C==='C'){ // «Разговор в Telegram»: scene + real chat bubbles from the site (q/a verbatim)
  scene();leak(.45);
  const bw=Math.min(sq?Math.round(W*.62):Math.round(W*(W/H>1.5?.40:.48)),FL-pad-Math.round(24*u)),x=pad;
  lock(Math.round(32*u),pad,pad);
  const h=el('t',T,{left:x+'px',top:px(150),color:INK,textShadow:'0 0 30px rgba(255,255,255,.9)'});QA.fs=fit(h,sq?70:Math.round(84*u),40,Math.max(bw,FL-pad-Math.round(50*u)),sq?3:2);
  let y=150*u+h.offsetHeight+Math.round(36*u);const fs=Math.round((sq?27:30)*u);
  const q=el('bub',S.q,{position:'absolute',left:(x+bw*.18)+'px',top:y+'px',width:(bw*.82)+'px',fontSize:fs+'px',lineHeight:1.3,padding:`${fs*.7}px ${fs*.9}px`,background:'#fff',borderRadius:`${fs}px ${fs}px ${fs*.25}px ${fs}px`,boxShadow:'0 14px 40px -16px rgba(60,50,30,.35)'});
  y+=q.offsetHeight+Math.round(16*u);
  const a=el('bub',`<b style="display:block;font-size:.8em;color:${DEEP};margin-bottom:.25em">${S.name}</b>${S.a}`,{position:'absolute',left:(x+fs*2.6)+'px',top:y+'px',width:(bw*.9)+'px',fontSize:fs+'px',lineHeight:1.3,padding:`${fs*.7}px ${fs*.9}px`,background:PALE,borderRadius:`${fs}px ${fs}px ${fs}px ${fs*.25}px`,boxShadow:'0 14px 40px -16px rgba(60,50,30,.35)',border:`2px solid ${VIV2}`});
  img(`../instagram/face-${K}.png`,{left:x+'px',top:(y+a.offsetHeight-fs*2.1)+'px',width:fs*2.1+'px',height:fs*2.1+'px',borderRadius:'50%',boxShadow:'0 0 0 3px #fff'});
  const yb=H-pad-Math.round(84*u);offer(x,yb,Math.round(29*u),VIV,INK);
  {const c=cta(0,yb,Math.round(29*u),INK,'#fff');c.style.left=(W-pad-c.offsetWidth)+'px';const o=document.querySelectorAll('.chip')[0];if(x+o.offsetWidth+16>W-pad-c.offsetWidth){o.style.top=(yb-Math.round(96*u))+'px';c.style.left=x+'px'}}
}
if(C==='D'){ // «Крупный портрет»: cut-out expert on a bright colour field, big hook + sticker
  el('a','',{inset:0,background:`radial-gradient(ellipse at 75% 30%, #fffaf2 0%, ${VIV2} 55%, ${VIV} 100%)`});
  el('a','',{inset:0,background:'repeating-conic-gradient(from 200deg at 78% -10%, rgba(255,255,255,.22) 0deg 6deg, rgba(255,255,255,0) 6deg 14deg)'});
  const c=CUT[K],sc=(H*(sq?.66:.95))/c.h,cw=c.w*sc,fx=c.fcx*sc,left=sq?Math.min(W-cw*.92,W*.70-fx):Math.max(Math.min(W-cw*.80, W*.74-fx), W*.30);
  img(`../instagram/cut-${K}.png`,{left:left+'px',top:(H-c.h*sc)+'px',width:cw+'px',height:c.h*sc+'px',filter:'drop-shadow(0 30px 40px rgba(60,40,20,.25)) brightness(1.04) saturate(1.08)'});
  lock(Math.round(34*u),pad,pad);
  const FLd=left+(c.fcx-c.fh*.78)*sc;const iw=sq?W-2*pad:Math.min(Math.round(W*(W/H>1.5?.46:.52)),FLd-pad-Math.round(20*u));
  const h=el('t',T,{left:pad+'px',top:px(sq?150:200),color:INK,fontWeight:700});QA.fs=fit(h,Math.round((sq?96:118)*u),52,iw,sq?2:3);
  const nm=el('t',name,{left:pad+'px',top:((sq?150:200)*u+h.offsetHeight+Math.round(26*u))+'px',fontSize:px(36),fontWeight:600,letterSpacing:'-.01em',color:DEEP,width:iw+'px',lineHeight:1.2});
  el('chip',O.nocard,{left:pad+'px',top:(H-pad-Math.round(196*u))+'px',fontSize:'39px',padding:'20px 34px',background:'#fff',color:INK});
  const st=Math.round(sq?200:220*u);const s=el('chip',`<div style="text-align:center;line-height:1.05"><div style="font-size:1.45em;font-weight:800;letter-spacing:-.04em">7 дней</div><div style="font-weight:700">бесплатно</div></div>`,{left:Math.max(left+fx-st*1.6,pad+iw*.6)+'px',top:(H*.50)+'px',width:st+'px',height:st+'px',justifyContent:'center',fontSize:Math.round(st*.15)+'px',background:'#fff',color:INK,transform:'rotate(-8deg)',boxShadow:'0 24px 50px -18px rgba(60,40,20,.45)'});
  if(sq){s.style.left=(W-pad-st)+'px';s.style.top=(H-pad-st+10)+'px'}
  cta(pad,H-pad-Math.round(84*u),30,INK,'#fff');
}
// grain
el('a','',{inset:0,opacity:.05,backgroundImage:'url("data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><filter id=%22n%22><feTurbulence baseFrequency=%22.9%22/></filter><rect width=%22200%22 height=%22200%22 filter=%22url(%23n)%22/></svg>")',pointerEvents:'none'});
Promise.all([document.fonts.load('600 40px M'),...imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{measure();window.QA=QA;B.dataset.ready=1});
</script></body></html>
