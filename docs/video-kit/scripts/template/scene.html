<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;src:url(manrope.woff) format('woff');font-weight:200 800}
*{box-sizing:border-box;margin:0}html,body{background:#000}
#st{position:relative;overflow:hidden;font-family:Manrope;color:#1b1c19;-webkit-font-smoothing:antialiased}
.abs{position:absolute}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t{position:absolute;text-wrap:balance}
.brand{position:absolute;display:flex;align-items:center;gap:.36em;font-weight:500;letter-spacing:-.045em;line-height:1}
.brand svg{width:1.3em;height:1.3em}
.pill{position:absolute;border-radius:999px;font-weight:600;line-height:1;white-space:nowrap}
</style></head><body><div id="st"></div>
<script src="sdata.js"></script>
<script>
const P=new URLSearchParams(location.search),K=P.get('e')||'asya',F=P.get('f')||'th',X=Object.assign({},SX[K]),st=document.getElementById('st');
if(P.get('t'))X.thumb=P.get('t');
// Russian typesetting: bind short words / prepositions to the next word (no hanging «в», «и», «без»…)
const ty=v=>v.replace(/(^|[\s(«])([А-Яа-яЁё]{1,2}|без|для|над|под|про|при|что|как|от|до)\s+/g,(m,a,b)=>a+b+'\u00a0').replace(/\u00a0([А-Яа-яЁё]{1,2})\s+/g,'\u00a0$1\u00a0');
X.thumb=ty(X.thumb.replace(/&nbsp;/g,'\u00a0'));X.show=ty(X.show);const WIDE=F!=='sq';const [W,H]=WIDE?[1280,720]:[1000,1000];st.style.width=W+'px';st.style.height=H+'px';
const mark=(c,sw)=>`<svg viewBox="0 0 48 48"><g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${[0,72,144,216,288].map(a=>`<path d="M24 20C17 14 19 6 24 3C29 6 31 14 24 20Z" transform="rotate(${a} 24 24)"/>`).join('')}</g></svg>`;
const el=(cls,html,css)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html||'';Object.assign(d.style,css||{});st.append(d);return d};
const INK='#1b1c19';
const pillBg=`color-mix(in srgb, ${X.accent} 62%, #ffffff)`;
function fit(t,max,min,lines,w){let s=max;for(;s>=min;s-=2){t.style.fontSize=s+'px';const lh=s*parseFloat(t.dataset.lh);if(Math.round(t.scrollHeight/lh)<=lines&&t.scrollWidth<=w+1)break}return s}
document.fonts.load('500 80px Manrope').then(()=>Promise.all([document.fonts.load('400 80px Manrope'),document.fonts.load('600 80px Manrope')])).then(()=>{
 const im=new Image();im.src=`work/${K}-${WIDE?'16x9':'1x1'}-up.jpg`;im.className='bg';st.append(im);
 // soft light wash on the left so text always sits on calm light wall
 el('abs','',{inset:0,background:WIDE?'linear-gradient(90deg, rgba(250,246,240,.55) 0, rgba(250,246,240,.32) 34%, rgba(250,246,240,0) 52%)':'linear-gradient(160deg, rgba(250,246,240,.55) 0, rgba(250,246,240,.25) 30%, rgba(250,246,240,0) 48%)'});
 if(F==='th'){
   el('brand',mark(INK,1.6)+'<span>EYRA</span>',{left:'72px',top:'56px',fontSize:'28px',color:INK});
   const nm=el('t',X.name+'.',{left:'74px',top:'0',fontSize:'34px',fontWeight:500,letterSpacing:'-.02em',lineHeight:1});
   const t=el('t',X.thumb,{left:'70px',top:'0',width:X.tw+'px',fontWeight:500,letterSpacing:'-.035em',color:INK});t.dataset.lh='1.02';t.style.lineHeight='1.02';
   fit(t,X.fs||80,X.fs||80,3,X.tw);
   const pl=el('pill',X.show,{left:'72px',top:'0',padding:'13px 22px',fontSize:'24px',background:pillBg,color:INK});
   const hN=34,gap1=22,hT=t.offsetHeight,gap2=30,hP=pl.offsetHeight,tot=hN+gap1+hT+gap2+hP,y0=Math.round((X.cy||372)-tot/2);
   nm.style.top=y0+'px';t.style.top=(y0+hN+gap1)+'px';pl.style.top=(y0+hN+gap1+hT+gap2)+'px';
 } else if(F==='pl'){
   el('brand',mark(INK,1.6)+'<span>EYRA</span>',{left:'72px',top:'56px',fontSize:'28px',color:INK});
   const nm=el('t',X.name,{left:'64px',top:'0',fontSize:'150px',fontWeight:500,letterSpacing:'-.055em',lineHeight:1});
   const sh=el('t',X.show,{left:'72px',top:'0',width:(X.pw||460)+'px',fontSize:'44px',fontWeight:500,letterSpacing:'-.02em',lineHeight:1.1});
   const pl=el('pill','Подкаст Эйры',{left:'72px',top:'0',padding:'13px 22px',fontSize:'24px',background:pillBg,color:INK});
   const hN=nm.offsetHeight,hS=sh.offsetHeight,hP=pl.offsetHeight,tot=hN+18+hS+32+hP,y0=Math.round((X.cy||372)-tot/2);
   nm.style.top=y0+'px';sh.style.top=(y0+hN+18)+'px';pl.style.top=(y0+hN+18+hS+32)+'px';
 } else if(F==='fr'){
   // calm in-video frame: extra soft veil, rubric as main line, room for live waveform + progress
   el('abs','',{inset:0,background:'rgba(250,246,240,.16)'});
   el('abs','',{inset:0,background:'linear-gradient(90deg, rgba(250,246,240,.42) 0, rgba(250,246,240,.2) 36%, rgba(250,246,240,0) 54%)'});
   el('brand',mark(INK,1.6)+'<span>EYRA</span>',{left:'72px',top:'56px',fontSize:'28px',color:INK});
   const nm=el('t',X.name+' · '+X.role,{left:'74px',top:'0',fontSize:'30px',fontWeight:500,letterSpacing:'-.01em',lineHeight:1,color:'#3b3c37'});
   const ttl=P.get('t')?X.thumb:X.show;
   const sh=el('t',ttl,{left:'70px',top:'0',width:(X.fw||430)+'px',fontWeight:500,letterSpacing:'-.03em',color:INK});sh.dataset.lh='1.05';sh.style.lineHeight='1.05';fit(sh,X.ffs||54,X.ffs||54,3,X.fw||430);
   const pl=el('pill','Подкаст Эйры',{left:'72px',top:'0',padding:'11px 20px',fontSize:'21px',background:pillBg,color:INK});
   const wv=el('wave','',{position:'absolute',left:'72px',top:'0',width:(X.fw||430)+'px',height:'64px'});
   const tr=el('track','',{position:'absolute',left:'72px',top:'0',width:(X.fw||430)+'px',height:'3px',borderRadius:'3px',background:'rgba(27,28,25,.12)'});
   const hN=30,hS=sh.offsetHeight,hP=pl.offsetHeight,tot=hN+20+hS+26+hP+40+64+18+3,y0=Math.round((X.fcy||360)-tot/2);
   nm.style.top=y0+'px';sh.style.top=(y0+hN+20)+'px';pl.style.top=(y0+hN+20+hS+26)+'px';
   const wy=y0+hN+20+hS+26+hP+40;wv.style.top=wy+'px';tr.style.top=(wy+64+18)+'px';
   // faint centre line where the live waveform will draw
   wv.innerHTML='<div style="position:absolute;left:0;right:0;top:31px;height:2px;border-radius:2px;background:rgba(27,28,25,.10)"></div>';
   window.layout={wave:[72,wy,X.fw||430,64],track:[72,wy+64+18,X.fw||430,3]};
 } else {
   el('brand',mark(INK,1.6)+'<span>EYRA</span>',{left:'64px',top:'60px',fontSize:'34px',color:INK});
   const nm=el('t',X.name,{left:'58px',top:'138px',fontSize:'150px',fontWeight:500,letterSpacing:'-.055em',lineHeight:1});
   const sh=el('t',X.show,{left:'64px',top:'306px',width:'400px',fontSize:'40px',fontWeight:500,letterSpacing:'-.02em',lineHeight:1.1});
   el('pill','Подкаст Эйры',{left:'64px',top:(306+sh.offsetHeight+30)+'px',padding:'14px 24px',fontSize:'28px',background:pillBg,color:INK});
 }
 // QA helper: count person-mask pixels under every text box (+16px margin)
 window.gap=()=>new Promise(res=>{const m=new Image();m.onload=()=>{const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.drawImage(m,0,0,W,H);
   const out=[];st.querySelectorAll('.t,.brand,.pill,.wave,.track').forEach(n=>{const r=n.getBoundingClientRect(),M=16;
     const x=Math.max(0,r.left-M|0),y=Math.max(0,r.top-M|0),w=Math.min(W-x,r.width+2*M|0),h=Math.min(H-y,r.height+2*M|0);
     const d=g.getImageData(x,y,w,h).data;let k=0;for(let j=0;j<d.length;j+=4)if(d[j]>90)k++;out.push([n.textContent.slice(0,16),k,Math.round(r.bottom)])});res(out)};
   m.src=`work/${K}-${WIDE?'16x9':'1x1'}-mask.png`});
 Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>setTimeout(()=>document.body.dataset.ready=1,200));
});
</script></body></html>
