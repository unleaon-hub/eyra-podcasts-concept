<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(manrope.woff);font-weight:200 800}
*{margin:0;box-sizing:border-box}body{overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:url(wall.jpg) center/cover}
.wash{position:absolute;inset:0}
.tile{position:absolute;background-size:cover;background-position:center top;border-radius:var(--r);
 box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 0 0 1px rgba(60,50,35,.06),0 24px 48px -30px rgba(70,52,28,.38)}
canvas{position:absolute}
</style></head><body><div class="bg"></div><div class="wash"></div><script src="lock.js"></script><script>
const P=new URLSearchParams(location.search),M=P.get('m');
const E='asya kira vera lera mira nika eva maya sofia alisa'.split(' ');
const C={ // stacked: centred lockup on top, one row of 10 tiles below
 yta:{W:2560,H:1440,cx:1280,cy:720,cap:118,tw:104,th:134,g:16,sp:42,r:12},
 rt:{W:2204,H:864,cx:1102,cy:318,cap:168,tw:160,th:206,g:22,sp:62,r:16},
 vk:{W:1920,H:768,cx:960,cy:366,cap:128,tw:100,th:129,g:13,sp:36,r:11}}[M];
document.body.style.width=C.W+'px';document.body.style.height=C.H+'px';
document.querySelector('.wash').style.background=`radial-gradient(48% 42% at ${C.cx/C.W*100}% ${C.cy/C.H*100}%,rgba(252,249,244,.62),rgba(252,249,244,0) 72%)`;
document.fonts.load('260 100px M').then(()=>document.fonts.load('450 100px M')).then(()=>{
 const cv=document.createElement('canvas');document.body.appendChild(cv);const L=lockup(cv,C.cap,{});
 const gap=C.cap*0.17,blockH=L.cap+gap+L.tcap,rw=10*C.tw+9*C.g,tot=blockH+C.sp+C.th,top=C.cy-tot/2;
 cv.style.left=(C.cx-L.inkW/2-L.pad)+'px';cv.style.top=(top-L.pad)+'px';
 const gx=C.cx-rw/2,gy=top+blockH+C.sp;
 E.forEach((e,i)=>{const t=document.createElement('div');t.className='tile';t.style.setProperty('--r',C.r+'px');
  Object.assign(t.style,{left:(gx+i*(C.tw+C.g))+'px',top:gy+'px',width:C.tw+'px',height:C.th+'px',backgroundImage:`url(t-${e}.jpg)`});document.body.appendChild(t)});
 const x0=C.cx-L.inkW/2;
 window.box={lock:[x0,top,x0+L.inkW,top+blockH],grid:[gx,gy,gx+rw,gy+C.th],L};
 setTimeout(()=>document.body.dataset.ready=1,500)});
</script></body></html>
